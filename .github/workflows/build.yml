name: Build and verify Windows executable
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./source/build.ps1 -Test
      - name: Verify EXE-only operation
        shell: pwsh
        run: ./source/tests/standalone.ps1
      - name: Check publishable files for personal paths and credentials
        shell: pwsh
        run: ./source/tests/privacy.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Perk-Finder-Windows-x64
          path: Perk Finder.exe
